
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest | Online Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">📚 BookNest</div>

        <div class="header-actions">
            <button id="themeToggle" class="theme-btn" type="button"
                    aria-label="Toggle dark mode">🌙</button>
            <a href="#cart" class="cart-link">
                🛒 Cart (<span id="cartCount">0</span>)
            </a>
        </div>
    </header>

    <section class="hero">
        <h1>Discover Your Next Favorite Book</h1>
        <p>Explore books, learn something new, and enjoy reading.</p>
        <a href="#books" class="hero-btn">Explore Books</a>
    </section>

    <main class="container">

        <section id="books">
            <h2>Our Book Collection</h2>

            <input
                type="search"
                id="searchInput"
                placeholder="Search by book title or author..."
                aria-label="Search books"
            >

            <div id="bookGrid" class="book-grid">
                <p>Loading books...</p>
            </div>
        </section>

        <section id="cart" class="cart-section">
            <h2>🛒 Your Shopping Cart</h2>

            <div id="cartItems">
                <p>Your cart is empty.</p>
            </div>

            <div class="cart-summary">
                <h3>Total: ₹<span id="cartTotal">0.00</span></h3>
                <button id="checkoutBtn" class="checkout-btn" type="button">
                    Proceed to Checkout
                </button>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 BookNest Online Bookstore | Happy Reading! 📖</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
